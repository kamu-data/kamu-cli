[package]
name = "kamu-wakeup-listener-sqlite"
description = "Sqlite-specific implementation of wakeup listener (polling)"
version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
readme = { workspace = true }
license-file = { workspace = true }
keywords = { workspace = true }
include = { workspace = true }
edition = { workspace = true }
publish = { workspace = true }


[lints]
workspace = true


[lib]
doctest = false


[dependencies]
wakeup-listener = { workspace = true }

dill = { version = "0.17", default-features = false }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
    "sync",
    "time",
] }
tracing = { version = "0.1", default-features = false }


[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
] }
test-group = { version = "1" }
test-log = { version = "0.2", features = [
    "trace",
] }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
    "test-util",
    "time",
] }
