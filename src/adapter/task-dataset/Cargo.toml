[package]
name = "kamu-adapter-task-dataset"
description = "Adapter for Kamu's task system's abstract interactions with dataset operations."
version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
readme = { workspace = true }
license-file = { workspace = true }
keywords = { workspace = true }
include = { workspace = true }
edition = { workspace = true }
publish = { workspace = true }


[lints]
workspace = true


[lib]
doctest = false


[features]
default = [
]
testing = [
]


[dependencies]
common-macros = { workspace = true }
database-common = { workspace = true }
database-common-macros = { workspace = true }
internal-error = { workspace = true }
kamu-core = { workspace = true }
kamu-datasets = { workspace = true }
kamu-task-system = { workspace = true }
odf = { workspace = true }
random-strings = { workspace = true }

async-trait = { version = "0.1", default-features = false }
dill = { version = "0.17", default-features = false }
serde = { version = "1", features = [
    "derive",
] }
serde_json = { version = "1", default-features = false }
tracing = "0.1"


[dev-dependencies]
container-runtime = { workspace = true }
kamu = { workspace = true, features = [
    "testing",
] }
kamu-core = { workspace = true, features = [
    "testing",
] }
kamu-datasets-inmem = { workspace = true }
kamu-datasets-services = { workspace = true, features = [
    "testing",
] }

chrono = { version = "0.4", default-features = false }
datafusion = { version = "55", default-features = false }
oop = "0.0.2"
pretty_assertions = { version = "1" }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
] }
