type CollectionProjection {
	"""
	Returns an entry at the specified path
	"""
	entry(path: CollectionPath!): CollectionEntry
	"""
	Returns the state of entries as they existed at a specified point in
	time
	"""
	entries(
		"""
		Return only entries whose path starts with this prefix
		"""
		pathPrefix: CollectionPath,
		"""
		Return only a single entry after reaching a certain path depth. Depth is counted from the root, not from `pathPrefix`: `/a` is at depth 1, `/dir/c` at depth 2. For example given entries `/a, /b, /dir/c, /dir/d` at depth 1 it will return `/a, /b, /dir/c` - the first two as actual entries at depth 1, and the last one as an indicator that there is one or more entries under `/dir`. Using the combination of `pathPrefix` and `maxDepth` you can walk entries as a directory hierarchy, e.g. `pathPrefix: "/dir/", maxDepth: 2` lists the children of `/dir`. Must not exceed 64.
		"""
		maxDepth: Int,		page: Int,		perPage: Int
	): CollectionEntryConnection!
	"""
	Find entries that link to specified DIDs
	"""
