name: lint-harness
# Only harness files: code changes run the same repository lints through the build workflow's
# test suite, and that workflow skips the documentation-only changes this one exists for.
on:
  push:
    branches:
      - master
    paths: &harness_paths
      - ".github/workflows/lint-harness.yaml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "DEVELOPER.md"
      - "Makefile"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - "docs/internal/**"
      - "scripts/agents/**"
      - "src/utils/repo-tools/**"
  pull_request:
    paths: *harness_paths
  workflow_dispatch: { }
jobs:
  lint_harness:
    name: Lint / Agent harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo tools
        run: cargo binstall cargo-nextest -y --force --github-token ${{ secrets.GITHUB_TOKEN }}
      - name: Agent hooks and harness lints
        run: make lint-harness
